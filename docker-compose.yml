version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurevia_motors_app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DJANGO_ENV=production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - ETHEREUM_RPC_URL=${ETHEREUM_RPC_URL:-}
      - ETHEREUM_SETTLEMENT_ADDRESS=${ETHEREUM_SETTLEMENT_ADDRESS:-}
      - ETHEREUM_CHAIN_ID=${ETHEREUM_CHAIN_ID:-1}
    volumes:
      - sqlite_data:/app/backups
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/?format=json || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  sqlite_data:
  media_data:
  static_data:
